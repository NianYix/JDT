[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aec-backend"
version = "0.1.0"
description = "AI Engineering Copilot — Backend foundation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.6.0",
  "alembic>=1.14.0",
  "redis>=5.2.0",
  "PyJWT>=2.9.0",
  "email-validator>=2.2.0",
  "passlib[bcrypt]>=1.7.4",
  "bcrypt>=4.0.0,<4.1.0",
  "sqladmin>=0.20.0",
  "itsdangerous>=2.2.0",
  "openai>=1.60.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
