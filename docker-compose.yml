services:
  postgres:
    image: postgres:16-alpine
    container_name: aec-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aec}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aec}
      POSTGRES_DB: ${POSTGRES_DB:-aec}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - aec_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aec} -d ${POSTGRES_DB:-aec}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: aec-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - aec_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  aec_pg_data:
  aec_redis_data:
